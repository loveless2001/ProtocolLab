name: ProtocolLab acceptance
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      BEND_NO_TELEMETRY: "1"
      BEND_VERSION: "2.0.16"
      BEND_ARCHIVE_SHA256: "496ff13a312221c3dc0dde4077368ced42c0f3eadcb61c2d43de5caddf0e50b4"
      BEND_BINARY_SHA256: "1c39375c1bf500542d5de373a4658986e090229ff966fa3ebf77065f37265a2b"
      BUN_VERSION: "1.3.8"
      BUN_ARCHIVE_SHA256: "0322b17f0722da76a64298aad498225aedcbf6df1008a1dee45e16ecb226a3f1"
      BUN_BINARY_SHA256: "0bb81ea882bce5946a1fc0d26d61880276d81fe22714714b5a2b792bdff8ea7a"
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux isolation and pinned tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python3 -m pip install uv==0.11.1
          uv python install 3.12.3
          uv sync --locked --extra local-model
      - name: Install Bun and Bend toolchain
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" -o /tmp/bun.zip
          echo "${BUN_ARCHIVE_SHA256}  /tmp/bun.zip" | sha256sum -c -
          unzip -q /tmp/bun.zip -d /tmp/bun-release
          mkdir -p "$HOME/.bun/bin"
          install -m 0755 /tmp/bun-release/bun-linux-x64/bun "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bun/bin:$PATH"

          curl -fsSL "https://github.com/bendlang/bend/releases/download/v${BEND_VERSION}/bend-${BEND_VERSION}-linux-x64.tar.gz" -o /tmp/bend.tar.gz
          echo "${BEND_ARCHIVE_SHA256}  /tmp/bend.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.bend"
          tar -xzf /tmp/bend.tar.gz -C "$HOME/.bend" --strip-components=1
          echo "${BEND_BINARY_SHA256}  $HOME/.bend/bin/bend" | sha256sum -c -
          echo "$HOME/.bend/bin" >> $GITHUB_PATH
          export PATH="$HOME/.bend/bin:$PATH"
          mkdir -p "$HOME/.bend/bend2"
          cp -r verified/lifecycle/toolchain/bend2/. "$HOME/.bend/bend2/"
          echo "${BUN_BINARY_SHA256}  $HOME/.bun/bin/bun" | sha256sum -c -
          test "$(bun --version)" = "$BUN_VERSION"
          test "$(bend --version)" = "bend $BEND_VERSION"
      - name: Check sandbox Python startup
        run: |
          set -euo pipefail
          uv run --no-sync python -m protocollab.isolation | tee sandbox-preflight.json
      - name: Verify
        run: |
          bend verified/lifecycle/PROOF.bend
          uv run --no-sync ruff check protocollab protocollab_environment tests
          uv run --no-sync pytest --junitxml=acceptance.junit.xml
          uv run --no-sync python scripts/check_acceptance.py acceptance.junit.xml
          python3 design/fixtures/check_design_fixture.py
      - name: Fresh native replay and scoring
        run: |
          uv run --no-sync protocollab demo --output runs/ci-native --seed 7
          uv run --no-sync protocollab verify runs/ci-native
          uv run --no-sync protocollab replay runs/ci-native
          uv run --no-sync protocollab score runs/ci-native > native-score.json
          uv run --no-sync protocollab bundle runs/ci-native --output native-evidence.zip
          uv run --no-sync protocollab verify-bundle native-evidence.zip > native-bundle-verification.json
      - name: Retain validation and sanitized native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-engineering-evidence
          path: |
            sandbox-preflight.json
            acceptance.junit.xml
            native-score.json
            native-evidence.zip
            native-evidence.zip.sha256
            native-bundle-verification.json
