name: ProtocolLab acceptance
on: [push, pull_request]
jobs:
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux isolation and pinned tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python3 -m pip install uv==0.11.1
          uv python install 3.12.3
          uv sync --locked --extra local-model
      - name: Verify
        run: |
          uv run --no-sync ruff check protocollab protocollab_environment tests
          uv run --no-sync pytest --junitxml=acceptance.junit.xml
          uv run --no-sync python scripts/check_acceptance.py acceptance.junit.xml
          python3 design/fixtures/check_design_fixture.py
