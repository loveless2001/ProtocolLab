[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "protocollab"
version = "0.1.0"
description = "Governed black-box protocol learning with auditable evidence"
requires-python = ">=3.12,<3.13"
dependencies = ["aalpy==1.5.2", "pydantic==2.12.5", "cryptography==46.0.5", "PyYAML==6.0.3"]

[project.optional-dependencies]
local-model = ["transformers==4.57.3", "torch==2.9.1"]

[project.scripts]
protocollab = "protocollab.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "hypothesis==6.151.9", "jsonschema==4.26.0", "ruff==0.15.5"]

[tool.hatch.build.targets.wheel]
packages = ["protocollab", "protocollab_environment"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
