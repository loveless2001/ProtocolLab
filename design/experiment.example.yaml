# Design defaults, not measured performance and not an executable experiment runner.
# Pin all dependency/model identifiers before a confirmatory run.
spec_version: "0.1"
status: "proposed"
track: "F"  # F = learn/freeze/evaluate; O = ongoing/prequential; report separately.
model_port:
  backend: "local_frozen_checkpoint"
  checkpoint: null        # REQUIRED before run
  weights_sha256: null    # REQUIRED before run
  tokenizer_sha256: null  # REQUIRED before run
  config_sha256: null     # REQUIRED before run
  base_weight_updates: false
learning:
  library: "aalpy"
  pinned_version_or_commit: null  # REQUIRED before run
  algorithm: "Lstar"
  automaton_type: "mealy"
  counterexample_strategy: "prefixes_with_consistency"
  cache: true
  alphabet: [SUBMIT_A, SUBMIT_B, SIGNAL_X, SIGNAL_Y, CANCEL, STATUS, INSPECT, TICK]
  max_learning_and_conformance_steps: 10000
  max_admission_steps: 2000
  min_admission_steps: 200
  min_admission_complete_queries: 24
  max_total_resets: 1000
  max_query_length: 32
  max_model_states: 64
  max_candidate_rounds: 8
  exact_equivalence_oracle: false
planning:
  live_clock_contract: "live_command_then_tick/v1"
  max_search_depth: 16
  max_expanded_nodes: 10000
  max_procedure_primitives: 32
  reauthorize_each_primitive: true
control_authentication:
  signature_algorithm: "Ed25519"
  library: "cryptography"
  pinned_version: null  # REQUIRED before run
  reject_duplicate_json_keys: true
  reject_floats_and_nonfinite_values: true
  domain_separator: "ProtocolLab/control/v0.1"
runtime:
  max_live_turns: 80
  max_llm_calls_per_suffix: 24
  max_llm_calls_per_prefix: 24
  max_input_tokens_per_call: 16384
  max_output_tokens_per_call: 1024
  deadline_seconds_per_model_call: 120
  trusted_dispatch_apply_timeout_ms: 1000  # local simulator only; must be measured
  readings_required_for_completion: 2
  minimum_ticks_between_completion_readings: 2
  pause_scope_default: "agent_all"
  pause_does_not_freeze_world: true
  counterfactual_writes_real_state: false
  mutation_on_unknown_authority: false
  direct_actor_backend_route: false
  execute_llm_generated_python: false
  private_environment_access: false
statistics:
  inference_unit: "protocol_topology"
  cluster_repeated_tasks_and_seeds: true
  confidence_level: 0.95
  thresholds_are_proposed: true
  sealed_test_used_for_admission: false
confirmatory_sizing_candidate:
  topologies: 48
  strata: 3
  decoding_seeds: 3
  clean_suffixes_per_topology: 6
  paired_intervention_sets_per_topology: 4
  suffix_runs_per_condition: 2016
report:
  separate_actor_attempts_from_executed_actions: true
  separate_inflight_effects_from_post_fence_dispatch: true
  separate_accuracy_and_coverage: true
  separate_track_F_and_track_O: true
  report_zero_violations_as_observed_not_proven_safe: true
